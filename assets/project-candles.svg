<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <filter id="candleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5B1363" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="420" rx="20" fill="#F5EEF7"/>

  <!-- Candle Brand Identity Mockup Card -->
  <g filter="url(#candleShadow)" transform="translate(130, 40)">
    <rect width="340" height="340" rx="16" fill="#FFFFFF" stroke="#ECE8F0" stroke-width="1.5"/>

    <!-- Subtle arch graphic in background -->
    <path d="M 170 300 C 100 300, 100 130, 170 130 C 240 130, 240 300, 170 300 Z" fill="#F5EEF7" opacity="0.8"/>

    <!-- Brand Header -->
    <text x="170" y="48" font-family="'Playfair Display', serif" font-size="17" font-weight="bold" fill="#5B1363" text-anchor="middle" letter-spacing="2">LUMIÈRE</text>
    <text x="170" y="62" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="600" fill="#555555" text-anchor="middle" letter-spacing="2.5">HANDCRAFTED SOY CANDLES</text>

    <!-- Candle Container Mockup in Royal Purple Glass -->
    <g transform="translate(170, 185)">
      <!-- Candle glass jar -->
      <rect x="-45" y="-30" width="90" height="95" rx="12" fill="#EBD7F0" stroke="#C4A2CE" stroke-width="1.5"/>
      <!-- Inner wax -->
      <rect x="-41" y="-20" width="82" height="80" rx="8" fill="#FAF7FB"/>
      <!-- Candle Flame & Wick -->
      <line x1="0" y1="-20" x2="0" y2="-32" stroke="#5B1363" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 -34 Q -6 -46 0 -58 Q 6 -46 0 -34 Z" fill="#9C27B0"/>
      <path d="M 0 -36 Q -3 -44 0 -52 Q 3 -44 0 -36 Z" fill="#E1BEE7"/>
      <circle cx="0" cy="-45" r="18" fill="#CE93D8" opacity="0.3"/>

      <!-- Label on candle jar -->
      <rect x="-30" y="5" width="60" height="42" rx="4" fill="#5B1363"/>
      <text x="0" y="22" font-family="'Playfair Display', serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">AMETHYST &amp; FIG</text>
      <text x="0" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" fill="#DFC1E6" text-anchor="middle">NO. 07 • 220G</text>
    </g>

    <!-- Bottom Features Chips -->
    <g transform="translate(45, 290)">
      <rect x="0" y="0" width="75" height="24" rx="12" fill="#F5EEF7"/>
      <text x="37" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#5B1363" text-anchor="middle">ORGANIC WAX</text>

      <rect x="85" y="0" width="75" height="24" rx="12" fill="#F5EEF7"/>
      <text x="122" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#5B1363" text-anchor="middle">COTTON WICK</text>

      <rect x="170" y="0" width="80" height="24" rx="12" fill="#5B1363"/>
      <text x="210" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SHOP NOW →</text>
    </g>
  </g>
</svg>
