<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <filter id="posterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#5B1363" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="600" height="420" rx="20" fill="#F5EEF7"/>

  <!-- Minimalist Editorial Poster -->
  <g filter="url(#posterShadow)" transform="translate(160, 35)">
    <!-- Poster Paper -->
    <rect width="280" height="350" rx="4" fill="#FFFFFF" stroke="#ECE8F0" stroke-width="1.5"/>

    <!-- Small Header Meta -->
    <text x="30" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#5B1363" letter-spacing="1.5">ISSUE NO. 04 / 2026</text>
    <text x="250" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#555555" text-anchor="end">DESIGN STUDY</text>
    <line x1="30" y1="46" x2="250" y2="46" stroke="#ECE8F0" stroke-width="1"/>

    <!-- Geometric Layout Art in Royal Purple & Charcoal -->
    <circle cx="95" cy="120" r="50" fill="#5B1363"/>
    <circle cx="150" cy="120" r="40" fill="#7B1FA2" opacity="0.85"/>
    <rect x="140" y="85" width="85" height="85" fill="#EBD7F0" opacity="0.65"/>
    
    <!-- Bold Typography -->
    <text x="30" y="215" font-family="'Playfair Display', serif" font-size="34" font-weight="900" fill="#222222">LESS</text>
    <text x="30" y="248" font-family="'Playfair Display', serif" font-size="28" font-style="italic" fill="#5B1363">BUT BETTER.</text>

    <!-- Color Palette Swatches -->
    <g transform="translate(30, 275)">
      <circle cx="12" cy="12" r="12" fill="#5B1363"/>
      <circle cx="44" cy="12" r="12" fill="#7B1FA2"/>
      <circle cx="76" cy="12" r="12" fill="#9C27B0"/>
      <circle cx="108" cy="12" r="12" fill="#C4A2CE"/>
      <circle cx="140" cy="12" r="12" fill="#F5EEF7" stroke="#ECE8F0" stroke-width="1"/>
    </g>

    <!-- Footer metadata text lines -->
    <line x1="30" y1="312" x2="250" y2="312" stroke="#ECE8F0" stroke-width="1"/>
    <text x="30" y="328" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#555555">FORM FOLLOWS FUNCTION</text>
    <text x="250" y="328" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#5B1363" font-weight="700" text-anchor="end">MALAK HAMDY STUDIO</text>
  </g>
</svg>
