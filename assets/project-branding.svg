<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEF7"/>
      <stop offset="100%" stop-color="#E8D5EC"/>
    </linearGradient>
    <filter id="shadowP1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#5B1363" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="600" height="420" rx="20" fill="url(#bgP1)"/>

  <!-- Organic botanical shape -->
  <path d="M 50 350 C 120 180, 240 380, 380 260 C 440 210, 500 280, 550 200 L 600 420 L 0 420 Z" fill="#DFC1E6" opacity="0.4"/>
  <circle cx="100" cy="80" r="60" fill="#EBD7F0" opacity="0.6"/>

  <!-- Main Card Mockup Container -->
  <g filter="url(#shadowP1)" transform="translate(130, 45)">
    <rect width="340" height="330" rx="16" fill="#FFFFFF" stroke="#ECE8F0" stroke-width="1.5"/>
    
    <!-- Header of Mockup -->
    <circle cx="35" cy="35" r="14" fill="#5B1363" opacity="0.12"/>
    <text x="35" y="40" font-family="'Playfair Display', serif" font-size="14" font-weight="bold" fill="#5B1363" text-anchor="middle">A</text>
    <text x="60" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#222222" letter-spacing="1">AURA BOTANICALS</text>
    <text x="60" y="49" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#5B1363" font-weight="600">NATURAL SKINCARE • ALEXANDRIA</text>

    <!-- Social Carousel Image Placeholder Frame -->
    <rect x="25" y="70" width="290" height="175" rx="10" fill="#FAF7FB"/>
    
    <!-- Aesthetic Cosmetic Bottle Art inside -->
    <g transform="translate(170, 155)">
      <ellipse cx="0" cy="50" rx="42" ry="12" fill="#E8D8EC"/>
      <rect x="-35" y="-45" width="70" height="95" rx="8" fill="#FFFFFF" stroke="#EBD7F0" stroke-width="1"/>
      <rect x="-18" y="-62" width="36" height="18" rx="4" fill="#5B1363"/>
      <rect x="-10" y="-72" width="20" height="11" rx="2" fill="#7B1FA2"/>
      <!-- Bottle Label -->
      <rect x="-24" y="-20" width="48" height="50" rx="3" fill="#F5EEF7" stroke="#DFC1E6" stroke-width="0.8"/>
      <text x="0" y="-5" font-family="'Playfair Display', serif" font-size="9" font-weight="bold" fill="#5B1363" text-anchor="middle">AURA</text>
      <text x="0" y="5" font-family="'Plus Jakarta Sans', sans-serif" font-size="5" fill="#555555" text-anchor="middle">FACIAL SERUM</text>
      <text x="0" y="15" font-family="'Plus Jakarta Sans', sans-serif" font-size="4.5" fill="#5B1363" font-weight="bold" text-anchor="middle">100% ORGANIC</text>
    </g>

    <!-- Botanical Leaf element -->
    <path d="M 70 200 C 60 140, 100 110, 110 90 C 120 120, 115 170, 70 200 Z" fill="#7B1FA2" opacity="0.25"/>
    <path d="M 270 120 C 290 150, 275 190, 250 210 C 245 175, 260 140, 270 120 Z" fill="#7B1FA2" opacity="0.2"/>

    <!-- Bottom Caption & Engagement Indicators -->
    <rect x="25" y="260" width="85" height="10" rx="5" fill="#5B1363" opacity="0.85"/>
    <rect x="25" y="278" width="180" height="7" rx="3.5" fill="#D8C5E0"/>
    <rect x="25" y="291" width="130" height="7" rx="3.5" fill="#EADCEE"/>

    <!-- Instagram style dots indicator -->
    <circle cx="160" cy="308" r="3" fill="#5B1363"/>
    <circle cx="170" cy="308" r="2.5" fill="#D8C5E0"/>
    <circle cx="180" cy="308" r="2.5" fill="#D8C5E0"/>
  </g>
</svg>
