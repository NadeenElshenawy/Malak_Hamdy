<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleHeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EEF7"/>
      <stop offset="100%" stop-color="#EBD7F0"/>
    </linearGradient>
    <linearGradient id="primaryPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B1363"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5B1363" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Background decorative canvas -->
  <rect width="600" height="600" rx="36" fill="url(#purpleHeroBg)"/>
  
  <!-- Abstract artistic arches & geometric shapes -->
  <circle cx="480" cy="120" r="160" fill="#DFC1E6" opacity="0.6"/>
  <path d="M 80 480 C 140 380, 260 380, 320 480 Z" fill="#5B1363" opacity="0.15"/>
  <circle cx="110" cy="160" r="50" fill="#7B1FA2" opacity="0.15"/>

  <!-- Designer Stylized Portrait Illustration -->
  <g filter="url(#purpleGlow)" transform="translate(150, 110)">
    <!-- Base Body Silhouette -->
    <path d="M 150 420 C 60 410, 20 450, 0 490 L 300 490 C 280 450, 240 410, 150 420 Z" fill="url(#primaryPurpleGrad)"/>
    
    <!-- Chic Collar -->
    <path d="M 110 390 L 150 435 L 190 390 C 170 415, 130 415, 110 390 Z" fill="#DFC1E6"/>
    
    <!-- Neck -->
    <rect x="125" y="320" width="50" height="85" rx="20" fill="#F0D5BB"/>
    
    <!-- Head Base -->
    <ellipse cx="150" cy="245" rx="72" ry="92" fill="#F7DFCB"/>
    
    <!-- Stylized Modern Dark Hair -->
    <path d="M 75 220 C 70 120, 170 95, 225 130 C 240 170, 235 250, 225 290 C 215 250, 210 200, 185 180 C 150 170, 115 190, 95 240 C 85 270, 80 280, 75 220 Z" fill="#222222"/>
    <path d="M 75 225 C 72 310, 95 340, 105 350 C 95 320, 95 270, 100 240 Z" fill="#181818"/>
    <path d="M 225 230 C 230 320, 205 345, 195 355 C 205 325, 205 270, 200 240 Z" fill="#181818"/>

    <!-- Eyebrows -->
    <path d="M 112 215 Q 128 208 140 216" stroke="#333333" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 160 216 Q 172 208 188 215" stroke="#333333" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Stylish Purple Round Glasses -->
    <circle cx="127" cy="235" r="21" fill="none" stroke="#5B1363" stroke-width="3.5"/>
    <circle cx="173" cy="235" r="21" fill="none" stroke="#5B1363" stroke-width="3.5"/>
    <line x1="148" y1="233" x2="152" y2="233" stroke="#5B1363" stroke-width="3"/>
    
    <!-- Eyes -->
    <path d="M 120 236 Q 127 240 134 236" stroke="#222222" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 166 236 Q 173 240 180 236" stroke="#222222" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Nose & Smile -->
    <path d="M 150 244 L 148 262 L 153 263" stroke="#C99F7B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 137 282 Q 150 293 163 282" stroke="#B0486D" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="112" cy="262" rx="10" ry="6" fill="#F0A8BF" opacity="0.45"/>
    <ellipse cx="188" cy="262" rx="10" ry="6" fill="#F0A8BF" opacity="0.45"/>
  </g>

  <!-- Decorative Sparkles -->
  <g transform="translate(110, 110)">
    <path d="M 0 -12 L 3 -3 L 12 0 L 3 3 L 0 12 L -3 3 L -12 0 L -3 -3 Z" fill="#5B1363"/>
  </g>
  <g transform="translate(490, 360)">
    <path d="M 0 -16 L 4 -4 L 16 0 L 4 4 L 0 16 L -4 4 L -16 0 L -4 -4 Z" fill="#7B1FA2"/>
  </g>
  
  <!-- Subtle Grid Dots pattern top right -->
  <g fill="#5B1363" opacity="0.5">
    <circle cx="490" cy="70" r="2.5"/><circle cx="510" cy="70" r="2.5"/><circle cx="530" cy="70" r="2.5"/>
    <circle cx="490" cy="90" r="2.5"/><circle cx="510" cy="90" r="2.5"/><circle cx="530" cy="90" r="2.5"/>
    <circle cx="490" cy="110" r="2.5"/><circle cx="510" cy="110" r="2.5"/><circle cx="530" cy="110" r="2.5"/>
  </g>
</svg>
