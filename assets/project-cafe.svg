<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleRoastBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B1363"/>
      <stop offset="100%" stop-color="#36083C"/>
    </linearGradient>
    <linearGradient id="violetAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4A2CE"/>
      <stop offset="100%" stop-color="#8E24AA"/>
    </linearGradient>
    <filter id="cafeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5B1363" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="600" height="420" rx="20" fill="#F5EEF7"/>
  <circle cx="500" cy="90" r="120" fill="#EBD7F0" opacity="0.5"/>

  <!-- Coffee & Lounge Post Card in Deep Royal Plum & Violet -->
  <g filter="url(#cafeShadow)" transform="translate(140, 40)">
    <rect width="320" height="340" rx="18" fill="url(#purpleRoastBg)"/>
    
    <!-- Top badge -->
    <rect x="25" y="25" width="95" height="22" rx="11" fill="url(#violetAmber)"/>
    <text x="72" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SIGNATURE ROAST</text>

    <!-- Coffee Cup Graphic & Latte Art Illustration -->
    <g transform="translate(160, 155)">
      <!-- Saucer -->
      <ellipse cx="0" cy="45" rx="75" ry="18" fill="#240529"/>
      <ellipse cx="0" cy="42" rx="68" ry="14" fill="#36083C"/>
      <!-- Cup body -->
      <path d="M -50 -10 C -45 35, 45 35, 50 -10 Z" fill="#9C27B0"/>
      <path d="M -46 -8 C -42 30, 42 30, 46 -8 Z" fill="#EBD7F0"/>
      <!-- Cup rim -->
      <ellipse cx="0" cy="-10" rx="50" ry="16" fill="#4A0E50"/>
      <ellipse cx="0" cy="-10" rx="45" ry="13" fill="#6A1B75"/>
      <!-- Foam & Heart Art -->
      <ellipse cx="0" cy="-10" rx="42" ry="11" fill="#FAF5FB"/>
      <path d="M 0 -7 C -15 -17, -8 -3, 0 1 C 8 -3, 15 -17, 0 -7 Z" fill="#5B1363" opacity="0.9"/>
      <!-- Steam lines -->
      <path d="M -15 -35 Q -8 -45 -12 -58" stroke="#DFC1E6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
      <path d="M 3 -38 Q 12 -48 7 -64" stroke="#DFC1E6" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
      <path d="M 20 -33 Q 28 -43 23 -55" stroke="#DFC1E6" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    </g>

    <!-- Text Typography on Post -->
    <text x="160" y="245" font-family="'Playfair Display', serif" font-size="22" font-style="italic" fill="#FFFFFF" text-anchor="middle">Artisan Roastery</text>
    <text x="160" y="268" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="500" fill="#DFC1E6" text-anchor="middle" letter-spacing="2">SLOW BREWED • SERVED WITH SOUL</text>

    <!-- Action Tag -->
    <rect x="95" y="288" width="130" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.15" stroke="#DFC1E6" stroke-width="1"/>
    <text x="160" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Discover Today's Roast →</text>
  </g>
</svg>
